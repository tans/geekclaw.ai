<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeekClaw | 极客超算魔方</title>
    <meta
      name="description"
      content="GeekClaw AI 智能体电脑。保留原有视觉素材，使用轻量 Halo 版本稳定承载官网。"
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="backdrop">
        <div class="hero-grid"></div>
        <div class="orb orb-left"></div>
        <div class="orb orb-right"></div>
        <div class="orb orb-core"></div>
      </div>

      <header class="topbar">
        <div class="brand">
          <img src="/logo.png" alt="GeekClaw Logo" class="brand-logo" />
          <div>
            <p class="brand-title">GeekClaw</p>
            <p class="brand-subtitle">AI 智能体电脑</p>
          </div>
        </div>
        <a href="mailto:team@geekclaw.ai" class="button button-primary">联系团队</a>
      </header>

      <section class="hero-copy">
        <p class="eyebrow">GEEKCLAW</p>
        <h1>极客超算魔方</h1>
        <p class="lead">
          保留原有视觉内容，先用轻量、干净、稳定的方式承载官网。
        </p>
      </section>

      <section class="shot-card shot-card-first">
        <img
          src="/screenshot1.jpg"
          alt="GeekClaw 产品视觉图"
          class="hero-shot"
          loading="eager"
          decoding="async"
        />
      </section>

      <section class="shot-card shot-card-second">
        <div class="shot-glow"></div>
        <img
          src="/screenshot2.jpg"
          alt="极客超算魔方发布海报"
          class="hero-shot poster-shot"
          loading="lazy"
          decoding="async"
        />
        <div class="info-panel">
          <h2>当前站点状态</h2>
          <p>
            已从混乱的旧入口切回精简官网形态，当前版本不再依赖原先的大型站点工程。
          </p>
          <div class="actions">
            <a href="mailto:team@geekclaw.ai" class="button button-primary">商务联系</a>
            <a href="/health" class="button button-secondary">健康检查</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
